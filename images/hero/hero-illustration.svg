<svg width="600" height="600" viewBox="0 0 600 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2b98ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#13497b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#646cff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circles -->
  <circle cx="300" cy="300" r="280" fill="url(#mainGradient)" opacity="0.1"/>
  <circle cx="300" cy="300" r="220" fill="url(#accentGradient)" opacity="0.08"/>
  
  <!-- Main monitor/screen -->
  <rect x="120" y="150" width="360" height="240" rx="12" fill="url(#mainGradient)" opacity="0.95"/>
  <rect x="135" y="165" width="330" height="210" rx="6" fill="#0a1929"/>
  
  <!-- Code lines inside screen -->
  <line x1="155" y1="190" x2="280" y2="190" stroke="#2b98ff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <line x1="155" y1="210" x2="380" y2="210" stroke="#646cff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="175" y1="230" x2="320" y2="230" stroke="#2b98ff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="155" y1="250" x2="350" y2="250" stroke="#646cff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="175" y1="270" x2="290" y2="270" stroke="#2b98ff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="155" y1="290" x2="370" y2="290" stroke="#646cff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="175" y1="310" x2="310" y2="310" stroke="#2b98ff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <line x1="155" y1="330" x2="340" y2="330" stroke="#646cff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  
  <!-- Cursor/caret blinking -->
  <rect x="350" y="327" width="3" height="16" fill="#2b98ff" opacity="0.9">
    <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  
  <!-- Monitor stand -->
  <rect x="270" y="390" width="60" height="8" rx="4" fill="url(#mainGradient)" opacity="0.7"/>
  <rect x="240" y="398" width="120" height="4" rx="2" fill="url(#mainGradient)" opacity="0.5"/>
  
  <!-- Floating code brackets -->
  <g filter="url(#glow)">
    <text x="80" y="100" font-size="48" font-weight="bold" fill="#2b98ff" opacity="0.6">&lt;/&gt;</text>
  </g>
  
  <g filter="url(#glow)">
    <text x="480" y="480" font-size="42" font-weight="bold" fill="#646cff" opacity="0.5">{ }</text>
  </g>
  
  <!-- Floating code symbol cards -->
  <g opacity="0.8">
    <rect x="50" y="280" width="50" height="50" rx="8" fill="url(#accentGradient)" opacity="0.9"/>
    <text x="63" y="312" font-size="28" font-weight="bold" fill="white">JS</text>
  </g>
  
  <g opacity="0.8">
    <rect x="500" y="200" width="50" height="50" rx="8" fill="url(#mainGradient)" opacity="0.9"/>
    <text x="510" y="232" font-size="28" font-weight="bold" fill="white">TS</text>
  </g>
  
  <!-- Checkmarks/success indicators -->
  <circle cx="520" cy="350" r="24" fill="#10b981" opacity="0.2"/>
  <path d="M 510 350 L 517 357 L 530 343" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <circle cx="70" cy="420" r="20" fill="#10b981" opacity="0.2"/>
  <path d="M 62 420 L 68 426 L 78 414" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Animated dots/particles -->
  <circle cx="450" cy="120" r="4" fill="#2b98ff">
    <animate attributeName="cy" values="120;100;120" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="100" cy="500" r="3" fill="#646cff">
    <animate attributeName="cy" values="500;520;500" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="520" cy="450" r="3" fill="#8b5cf6">
    <animate attributeName="cx" values="520;540;520" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Terminal prompt indicator -->
  <text x="155" y="185" font-size="14" font-family="monospace" fill="#10b981" opacity="0.8">$</text>
</svg>
